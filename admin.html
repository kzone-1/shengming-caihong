<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 - 生命彩虹图测试记录</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f0f2f5;
      color: #333;
    }
    .login-wrap {
      max-width: 400px;
      margin: 80px auto;
      background: #fff;
      border-radius: 14px;
      padding: 36px 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .login-wrap h1 {
      margin: 0 0 24px;
      font-size: 22px;
      color: #0d7377;
      text-align: center;
    }
    .login-wrap input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 16px;
    }
    .login-wrap button {
      width: 100%;
      padding: 12px;
      background: #0d7377;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .login-wrap button:hover { background: #094f52; }
    .login-error {
      color: #e63946;
      font-size: 14px;
      margin-bottom: 12px;
      display: none;
    }

    .dashboard { display: none; }
    .dash-header {
      background: #fff;
      padding: 16px 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .dash-header h1 {
      margin: 0;
      font-size: 20px;
      color: #0d7377;
    }
    .dash-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .dash-actions input {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      width: 200px;
    }
    .dash-actions button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-export { background: #28a745; color: #fff; }
    .btn-export:hover { background: #218838; }
    .btn-refresh { background: #17a2b8; color: #fff; }
    .btn-refresh:hover { background: #138496; }
    .btn-logout { background: #e9ecef; color: #333; }
    .btn-logout:hover { background: #dde2e6; }
    .btn-tab {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .stats-bar {
      display: flex;
      gap: 16px;
      padding: 16px 24px;
      flex-wrap: wrap;
    }
    .stat-card {
      background: #fff;
      border-radius: 10px;
      padding: 16px 20px;
      flex: 1;
      min-width: 140px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .stat-card .label {
      font-size: 13px;
      color: #999;
      margin-bottom: 6px;
    }
    .stat-card .value {
      font-size: 26px;
      font-weight: 700;
      color: #0d7377;
    }

    .table-container {
      margin: 0 24px 24px;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 1000px;
    }
    th, td {
      padding: 10px 8px;
      text-align: center;
      border-bottom: 1px solid #f0f0f0;
      white-space: nowrap;
    }
    th {
      background: #f8f9fa;
      font-weight: 700;
      color: #555;
      position: sticky;
      top: 0;
    }
    tr:hover { background: #f8f9fa; }
    .talent-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }
    .talent-badge.shuai { background: #e74c3c; }
    .talent-badge.jiang { background: #3498db; }
    .talent-badge.hui { background: #2ecc71; }
    .score-high { color: #27ae60; font-weight: 700; }
    .score-low { color: #e74c3c; font-weight: 700; }
    .btn-delete {
      padding: 4px 10px;
      background: #fff;
      border: 1px solid #e63946;
      color: #e63946;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-delete:hover { background: #e63946; color: #fff; }
    .empty-msg {
      text-align: center;
      padding: 60px 20px;
      color: #999;
      font-size: 16px;
    }
    .avg-cell { background: #fff9e6; font-weight: 700; }

    /* ===== 分析报告弹窗 ===== */
    .btn-report {
      padding: 4px 10px;
      background: #0d7377;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      margin-right: 6px;
    }
    .btn-report:hover { background: #094f52; }
    .report-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.55);
      z-index: 1000;
      overflow-y: auto;
      padding: 30px 20px;
    }
    .report-overlay.active { display: block; }
    .report-modal {
      max-width: 760px;
      margin: 0 auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.25);
      overflow: hidden;
    }
    .report-modal-head {
      background: #0d7377;
      color: #fff;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .report-modal-head h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }
    .report-modal-head .sub {
      font-size: 13px;
      opacity: 0.9;
      font-weight: 400;
    }
    .report-close {
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    .report-close:hover { background: rgba(255,255,255,0.35); }
    .report-head-actions { display: flex; gap: 8px; }
    .btn-download-report {
      background: #ffb400;
      color: #4a3200;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-download-report:hover { background: #ffc733; }
    .btn-download-report:disabled { background: #f0c86b; cursor: wait; opacity: 0.8; }
    .report-body {
      padding: 24px;
      background: #f7f9fb;
      max-height: 70vh;
      overflow-y: auto;
    }
    .chart-wrap {
      background: #fff;
      border: 1px solid #e6edf2;
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 18px;
      height: 380px;
      position: relative;
    }
    .chart-wrap h3 { margin: 0 0 8px; font-size: 16px; color: #333; }
    .chart-hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 10px;
      text-align: center;
      font-size: 11px;
      color: #999;
    }
    #rainbowChart { display: block; width: 100%; }
    .report-summary {
      background: #fff;
      border: 1px solid #e6edf2;
      border-left: 4px solid #0d7377;
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.8;
      color: #444;
    }
    .report-talent {
      background: #fff;
      border: 1px solid #e6edf2;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 18px;
      text-align: center;
    }
    .report-talent h3 { margin: 0 0 10px; font-size: 16px; color: #333; }
    .report-talent .talent-name {
      display: inline-block;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      padding: 8px 28px;
      border-radius: 30px;
    }
    .report-talent .talent-name.shuai { background: #e74c3c; }
    .report-talent .talent-name.jiang { background: #3498db; }
    .report-talent .talent-name.hui { background: #2ecc71; }
    .report-talent .talent-info {
      margin-top: 12px;
      font-size: 14px;
      color: #666;
      line-height: 1.9;
    }
    .report-talent .talent-info strong { color: #0d7377; }
    .report-section {
      background: #fff;
      border: 1px solid #e6edf2;
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .report-section h3 {
      margin: 0 0 12px;
      font-size: 15px;
      color: #0d7377;
      border-left: 4px solid #0d7377;
      padding-left: 10px;
    }
    .ability-card {
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .ability-card:last-child { margin-bottom: 0; }
    .ability-card.strength { background: #eaf6ef; border: 1px solid #cde8d8; }
    .ability-card.weakness { background: #fdeeed; border: 1px solid #f6d3d0; }
    .ability-card h4 {
      margin: 0 0 6px;
      font-size: 14px;
      color: #333;
    }
    .ability-card .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 8px;
      border-radius: 10px;
      color: #fff;
      vertical-align: 2px;
    }
    .ability-card .badge.strength { background: #27ae60; }
    .ability-card .badge.weakness { background: #e74c3c; }
    .ability-card p { margin: 0 0 6px; font-size: 13px; color: #555; line-height: 1.7; }
    .ability-card ul { margin: 0; padding-left: 18px; }
    .ability-card li { font-size: 13px; color: #666; line-height: 1.8; }
    .report-goals ul { margin: 0; padding-left: 20px; }
    .report-goals li { font-size: 14px; color: #444; line-height: 2; }
    .report-goals li strong { color: #0d7377; }
    .report-empty { padding: 8px 12px; font-size: 13px; color: #888; background: #f8f9fa; border-radius: 6px; }
  </style>
</head>
<body>
  <!-- Login -->
  <div class="login-wrap" id="loginWrap">
    <h1>管理后台登录</h1>
    <div class="login-error" id="loginError">密码错误，请重试</div>
    <input type="password" id="passwordInput" placeholder="请输入管理密码" />
    <button id="loginBtn">登录</button>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard">
    <div class="dash-header">
      <h1>生命彩虹图测试记录</h1>
      <div class="dash-actions">
        <button class="btn-tab" id="tabRecordsBtn" style="background:#0d7377;color:#fff;">客户记录</button>
        <button class="btn-tab" id="tabAssistantsBtn" style="background:#e9ecef;color:#333;">助教管理</button>
      </div>
    </div>
    <div class="dash-actions" id="recordsActions" style="padding:12px 24px 0;">
        <select id="sourceFilter" style="padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;background:#fff;">
          <option value="">全部来源</option>
        </select>
        <input type="text" id="searchInput" placeholder="搜索孩子姓名或手机号..." />
        <button class="btn-refresh" id="refreshBtn">刷新</button>
        <button class="btn-export" id="exportBtn">导出 CSV</button>
        <button class="btn-logout" id="logoutBtn">退出</button>
    </div>
    <div id="recordsView">
      <div class="stats-bar" id="statsBar"></div>
      <div class="table-container">
        <table id="recordsTable">
          <thead>
            <tr>
              <th>序号</th>
              <th>孩子姓名</th>
              <th>手机号</th>
              <th>来源</th>
              <th>贵人力</th>
              <th>幸福力</th>
              <th>沟通力</th>
              <th>效能力</th>
              <th>自控力</th>
              <th>主角力</th>
              <th>专注力</th>
              <th>创富力</th>
              <th>抗挫力</th>
              <th>亲和力</th>
              <th>学习力</th>
              <th>领导力</th>
              <th>平均分</th>
              <th>天赋类型</th>
              <th>提交时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="recordsBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 助教管理视图 -->
    <div id="assistantsView" style="display:none;">
      <div style="margin:0 24px;">
        <div style="background:#fff;border-radius:12px;padding:20px 24px;box-shadow:0 2px 8px rgba(0,0,0,0.05);margin-bottom:20px;">
          <h3 style="margin:0 0 14px;color:#0d7377;border-left:4px solid #0d7377;padding-left:10px;">新增助教</h3>
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
            <input type="text" id="newAssistName" placeholder="助教姓名" style="padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;width:180px;" />
            <button id="addAssistBtn" style="padding:10px 18px;background:#28a745;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer;">添加助教</button>
          </div>
          <div style="font-size:12px;color:#999;margin-top:8px;">添加后系统会自动生成一条专属邀请链接，助教输入姓名即可查看和转发。</div>
        </div>
        <div style="background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.05);">
          <table style="width:100%;border-collapse:collapse;font-size:13px;min-width:700px;">
            <thead>
              <tr>
                <th style="padding:10px 8px;text-align:center;background:#f8f9fa;border-bottom:1px solid #f0f0f0;">序号</th>
                <th style="padding:10px 8px;text-align:center;background:#f8f9fa;border-bottom:1px solid #f0f0f0;">姓名</th>
                <th style="padding:10px 8px;text-align:center;background:#f8f9fa;border-bottom:1px solid #f0f0f0;">名下客户</th>
                <th style="padding:10px 8px;text-align:center;background:#f8f9fa;border-bottom:1px solid #f0f0f0;">专属链接</th>
                <th style="padding:10px 8px;text-align:center;background:#f8f9fa;border-bottom:1px solid #f0f0f0;">操作</th>
              </tr>
            </thead>
            <tbody id="assistantsBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // === Supabase 配置（复制你的 Supabase 项目 URL 和 anon key 替换下面两个值）===
    const SUPABASE_URL = 'https://xviogqxhmptrrogsqmgk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2aW9ncXhobXB0cnJvZ3NxbWdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0Mzk4MzgsImV4cCI6MjEwMjAxNTgzOH0.wi9qS0rBJuOtAOD14vxpfTh2rh0dzzJQRNKEcwrx5QE';
    let supabaseClient = null;
    try { supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) {}

    const ADMIN_PASSWORD = 'qiaomen2026';
    let allRecords = [];

    const ABILITY_NAMES = [
      "贵人力", "幸福力", "沟通力", "效能力", "自控力", "主角力",
      "专注力", "创富力", "抗挫力", "亲和力", "学习力", "领导力"
    ];

    // Login
    document.getElementById("loginBtn").addEventListener("click", async () => {
      const pwd = document.getElementById("passwordInput").value;
      if (!supabaseClient) { document.getElementById("loginError").textContent = "数据库未配置，无法登录"; document.getElementById("loginError").style.display = "block"; return; }
      if (pwd === ADMIN_PASSWORD) {
        document.getElementById("loginWrap").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        loadRecords();
      } else {
        document.getElementById("loginError").style.display = "block";
      }
    });

    document.getElementById("passwordInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("loginBtn").click();
    });

    // Load records
    async function loadRecords() {
      try {
        const { data, error } = await supabaseClient.from('submissions').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        allRecords = (data || []).map(r => ({
          id: r.id, childName: r.child_name, phone: r.phone || '', scores: r.scores,
          avgScore: r.avg_score, talentType: r.talent_type || '', source: r.source || '', submittedAt: r.created_at
        }));
        renderTable(allRecords);
        renderStats(allRecords);
        refreshSourceFilter();
      } catch (e) {
        document.getElementById("recordsBody").innerHTML = '<tr><td colspan="20" class="empty-msg">加载失败，请检查数据库配置并重试</td></tr>';
      }
    }

    // Render stats
    function renderStats(records) {
      const total = records.length;
      const today = new Date().toDateString();
      const todayCount = records.filter(r => new Date(r.submittedAt).toDateString() === today).length;
      const avgAll = total > 0 ? (records.reduce((sum, r) => sum + r.avgScore, 0) / total).toFixed(1) : "0.0";
      const shuaiCount = records.filter(r => r.talentType === "帅才").length;
      const jiangCount = records.filter(r => r.talentType === "将才").length;
      const huiCount = records.filter(r => r.talentType === "慧才").length;

      document.getElementById("statsBar").innerHTML = `
        <div class="stat-card"><div class="label">总提交数</div><div class="value">${total}</div></div>
        <div class="stat-card"><div class="label">今日提交</div><div class="value">${todayCount}</div></div>
        <div class="stat-card"><div class="label">平均分</div><div class="value">${avgAll}</div></div>
        <div class="stat-card"><div class="label">帅才</div><div class="value" style="color:#e74c3c">${shuaiCount}</div></div>
        <div class="stat-card"><div class="label">将才</div><div class="value" style="color:#3498db">${jiangCount}</div></div>
        <div class="stat-card"><div class="label">慧才</div><div class="value" style="color:#2ecc71">${huiCount}</div></div>
      `;
    }

    // Render table
    function renderTable(records) {
      const tbody = document.getElementById("recordsBody");
      if (records.length === 0) {
        tbody.innerHTML = '<tr><td colspan="20" class="empty-msg">暂无提交记录</td></tr>';
        return;
      }

      tbody.innerHTML = records.map((r, i) => {
        const scoreCells = ABILITY_NAMES.map((_, idx) => {
          const s = r.scores[idx] ?? "-";
          const cls = s >= 8 ? "score-high" : (s <= 5 ? "score-low" : "");
          return `<td class="${cls}">${s}</td>`;
        }).join("");

        const time = new Date(r.submittedAt).toLocaleString("zh-CN", { timeZone: "Asia/Shanghai" });
        const talentClass = r.talentType === "帅才" ? "shuai" : (r.talentType === "将才" ? "jiang" : "hui");

        return `
          <tr>
            <td>${i + 1}</td>
            <td style="font-weight:600">${r.childName}</td>
            <td style="font-family:monospace">${r.phone || "-"}</td>
            <td style="font-size:12px;color:#0d7377">${r.source || "-"}</td>
            ${scoreCells}
            <td class="avg-cell">${r.avgScore.toFixed(1)}</td>
            <td><span class="talent-badge ${talentClass}">${r.talentType}</span></td>
            <td style="font-size:12px;color:#999">${time}</td>
            <td>
              <button class="btn-report" onclick="openReport(${r.id})">查看报告</button>
              <button class="btn-delete" onclick="deleteRecord(${r.id})">删除</button>
            </td>
          </tr>
        `;
      }).join("");
    }

    // Search + filter
    let currentSourceFilter = "";
    let filteredRecords = [];
    function applyFilter() {
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
      let list = allRecords;
      if (currentSourceFilter) {
        list = list.filter(r => r.source === currentSourceFilter);
      }
      if (keyword) {
        list = list.filter(r =>
          r.childName.toLowerCase().includes(keyword) ||
          r.phone.includes(keyword) ||
          r.source.toLowerCase().includes(keyword)
        );
      }
      filteredRecords = list;
      renderTable(list);
      renderStats(list);
    }

    document.getElementById("searchInput").addEventListener("input", applyFilter);

    // Build source filter dropdown
    document.getElementById("sourceFilter").addEventListener("change", (e) => {
      currentSourceFilter = e.target.value;
      applyFilter();
    });

    function refreshSourceFilter() {
      const sel = document.getElementById("sourceFilter");
      const current = sel.value;
      const sources = [...new Set(allRecords.map(r => r.source).filter(Boolean))].sort();
      sel.innerHTML = '<option value="">全部来源</option>' +
        sources.map(s => `<option value="${s}">${s}</option>`).join("");
      if (sources.includes(current)) sel.value = current;
      else currentSourceFilter = "";
    }

    // Refresh
    document.getElementById("refreshBtn").addEventListener("click", loadRecords);

    // Export CSV (client-side) —— 导出当前筛选结果
    document.getElementById("exportBtn").addEventListener("click", () => {
      const exportList = filteredRecords.length ? filteredRecords : allRecords;
      const header = ["序号","孩子姓名","手机号","来源","贵人力","幸福力","沟通力","效能力","自控力","主角力","专注力","创富力","抗挫力","亲和力","学习力","领导力","平均分","天赋类型","提交时间"];
      const rows = exportList.map((r, i) => {
        const sc = ABILITY_NAMES.map((_, idx) => r.scores[idx] ?? "");
        const time = new Date(r.submittedAt).toLocaleString("zh-CN", { timeZone: "Asia/Shanghai" });
        return [i+1, r.childName, r.phone || "", r.source || "", ...sc, r.avgScore.toFixed(1), r.talentType, time];
      });
      const csv = "\uFEFF" + [header, ...rows].map(row => row.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      const suffix = currentSourceFilter ? `_${currentSourceFilter}` : "";
      a.href = URL.createObjectURL(blob); a.download = `submissions${suffix}_${Date.now()}.csv`; a.click();
    });

    // Logout
    document.getElementById("logoutBtn").addEventListener("click", () => {
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginWrap").style.display = "block";
      document.getElementById("passwordInput").value = "";
    });

    // Delete record
    window.deleteRecord = async function(id) {
      if (!confirm("确定要删除这条记录吗？")) return;
      try {
        const { error } = await supabaseClient.from('submissions').delete().eq('id', id);

    // ===== 助教管理 =====
    // 页签切换
    function showTab(which) {
      const isRecords = which === "records";
      document.getElementById("recordsView").style.display = isRecords ? "block" : "none";
      document.getElementById("recordsActions").style.display = isRecords ? "flex" : "none";
      document.getElementById("assistantsView").style.display = isRecords ? "none" : "block";
      const rb = document.getElementById("tabRecordsBtn");
      const ab = document.getElementById("tabAssistantsBtn");
      rb.style.background = isRecords ? "#0d7377" : "#e9ecef";
      rb.style.color = isRecords ? "#fff" : "#333";
      ab.style.background = isRecords ? "#e9ecef" : "#0d7377";
      ab.style.color = isRecords ? "#333" : "#fff";
      if (!isRecords) loadAssistants();
    }
    document.getElementById("tabRecordsBtn").addEventListener("click", () => showTab("records"));
    document.getElementById("tabAssistantsBtn").addEventListener("click", () => showTab("assistants"));

    // 生成随机邀请码（8位字母数字，避免与姓名关联）
    function genCode() {
      const chars = "abcdefghjkmnpqrstuvwxyz23456789"; // 去掉易混淆的 0/1/i/l/o
      let c = "";
      for (let i = 0; i < 8; i++) c += chars[Math.floor(Math.random() * chars.length)];
      return c;
    }

    // 加载助教列表 + 统计各自名下客户数
    async function loadAssistants() {
      const tbody = document.getElementById("assistantsBody");
      tbody.innerHTML = '<tr><td colspan="5" style="padding:40px;color:#999;">加载中...</td></tr>';
      try {
        const { data: assists, error: ae } = await supabaseClient.from('assistants').select('*').order('id');
        if (ae) throw ae;
        const { data: records, error: re } = await supabaseClient.from('submissions').select('source');
        if (re) throw re;
        // 统计每个来源的客户数
        const countMap = {};
        (records || []).forEach(r => { const s = r.source || ""; if (s) countMap[s] = (countMap[s] || 0) + 1; });

        const base = location.origin + location.pathname.replace(/admin\.html$/, "index.html");
        if (!assists || assists.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="padding:40px;color:#999;">还没有助教，请在上方添加</td></tr>';
          return;
        }
        tbody.innerHTML = assists.map((a, i) => {
          const link = base + "?c=" + a.code;
          const count = countMap[a.name] || 0;
          return `<tr data-code="${a.code}">
            <td style="padding:10px 8px;text-align:center;border-bottom:1px solid #f0f0f0;">${i + 1}</td>
            <td style="padding:10px 8px;text-align:center;border-bottom:1px solid #f0f0f0;font-weight:600;">${a.name}</td>
            <td style="padding:10px 8px;text-align:center;border-bottom:1px solid #f0f0f0;color:#0d7377;font-weight:700;">${count}</td>
            <td style="padding:10px 8px;border-bottom:1px solid #f0f0f0;">
              <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start;">
                <div style="display:flex;gap:6px;align-items:center;width:100%;">
                  <span id="long-${a.code}" style="font-family:monospace;font-size:12px;color:#0d7377;background:#eef6f6;padding:5px 10px;border-radius:6px;font-weight:700;max-width:260px;word-break:break-all;line-height:1.4;">加载中...</span>
                  <button onclick="copyLong('${a.code}')" style="padding:4px 10px;background:#0d7377;color:#fff;border:none;border-radius:4px;font-size:12px;cursor:pointer;white-space:nowrap;">复制长链接</button>
                </div>
                <button onclick="toggleShort('${a.code}')" style="padding:2px 0;background:none;border:none;color:#888;font-size:11px;cursor:pointer;">查看短链 ▾</button>
                <div id="short-${a.code}" style="display:none;font-family:monospace;font-size:11px;color:#c2185b;background:#fdeef3;padding:6px 8px;border-radius:4px;max-width:260px;word-break:break-all;line-height:1.5;"></div>
              </div>
            </td>
            <td style="padding:10px 8px;text-align:center;border-bottom:1px solid #f0f0f0;">
              <button onclick="deleteAssistant(${a.id})" style="padding:4px 10px;background:#fff;border:1px solid #e63946;color:#e63946;border-radius:4px;font-size:12px;cursor:pointer;">删除</button>
            </td>
          </tr>`;
        }).join("");

        // 长链接默认直接显示（微信内可点开），短链异步生成供备用查看
        assists.forEach(a => {
          const link = base + "?c=" + a.code;
          const lel = document.getElementById("long-" + a.code);
          if (lel) lel.textContent = link;
          shorten(link).then(s => {
            const el = document.getElementById("short-" + a.code);
            if (el) el.textContent = s || link;
          });
        });
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="5" style="padding:40px;color:#999;">加载失败，请重试</td></tr>';
      }
    }

    // 新增助教
    document.getElementById("addAssistBtn").addEventListener("click", async () => {
      const name = document.getElementById("newAssistName").value.trim();
      if (!name) { alert("请输入助教姓名"); return; }
      // 生成唯一 code（若冲突则重试）
      let code = genCode();
      for (let attempt = 0; attempt < 5; attempt++) {
        const { data, error } = await supabaseClient.from('assistants').insert({ name, code }).select().maybeSingle();
        if (error) {
          // code 冲突时重新生成
          if (error.message && error.message.includes('duplicate')) { code = genCode(); continue; }
          alert("添加失败：" + error.message); return;
        }
        document.getElementById("newAssistName").value = "";
        loadAssistants();
        return;
      }
      alert("添加失败，请重试");
    });

    // 删除助教
    window.deleteAssistant = async function(id) {
      if (!confirm("确定删除这位助教吗？其名下客户记录不会删除，但会失去来源归属。")) return;
      try {
        const { error } = await supabaseClient.from('assistants').delete().eq('id', id);
        if (error) throw error;
        loadAssistants();
      } catch (e) { alert("删除失败，请重试"); }
    };

    // 复制助教长链接（微信内可点开）
    window.copyLong = async function(code) {
      const el = document.getElementById("long-" + code);
      const link = el ? el.textContent : "";
      try { await navigator.clipboard.writeText(link); alert("长链接已复制，可直接转发给家长"); }
      catch(e) { prompt("复制链接：", link); }
    };

    // 复制助教短链（备用）
    window.copyShort = async function(code) {
      const el = document.getElementById("short-" + code);
      const link = el ? el.textContent : "";
      try { await navigator.clipboard.writeText(link); alert("短链接已复制"); }
      catch(e) { prompt("复制链接：", link); }
    };

    // 展开/收起短链
    window.toggleShort = function(code) {
      const box = document.getElementById("short-" + code);
      const btn = event.target;
      if (!box) return;
      const isOpen = box.style.display === "block";
      box.style.display = isOpen ? "none" : "block";
      btn.textContent = isOpen ? "查看短链 ▾" : "收起短链 ▴";
    };

    // 调用 tinyurl 生成短链（对同一长链接固定返回同一短码）
    async function shorten(longUrl) {
      try {
        const res = await fetch("https://tinyurl.com/api-create.php?url=" + encodeURIComponent(longUrl));
        if (!res.ok) return null;
        const t = (await res.text()).trim();
        return /^https?:\/\//.test(t) ? t : null;
      } catch(e) { return null; }
    }

    // ===== 查看已填写用户的分析报告（实时根据已存分数还原，与家长端一致）=====
    // 12 灵种能力数据（与 index.html 保持一致，用于还原报告卡片）
    const ABILITIES_DATA = [

      { key: "幸福力", high: { msg: "孩子人缘好、归属感强，良好的同伴关系能为学习提供情绪缓冲和合作资源。", tips: ["让孩子在小组学习中担任协调者，带动团队氛围。","通过同伴互评、小组作业，把社交优势转化为学习动力。","引导孩子关注需要帮助的同学，培养利他意识。"] }, low: { msg: "孩子在集体中可能感到压力，社交困扰容易影响学习状态和情绪稳定。", tips: ["多创造同伴一起学习的机会，如约同学一起写作业、做项目。","用角色扮演教孩子换位思考，练习与不同类型同学相处。","从共同兴趣（运动、游戏、阅读）入手，帮助孩子建立至少一个稳定友谊。"] } },
      { key: "沟通力", high: { msg: "孩子能较好地表达需求与情绪，亲子沟通顺畅，问题更容易被及时发现和解决。", tips: ["用「讲事实 + 说感受 + 提请求」的方式，带孩子复盘学习困难。","鼓励孩子对不认同的学习安排提出替代方案，而不是简单服从或对抗。","定期召开家庭会议，让孩子参与学习计划和规则的制定。"] }, low: { msg: "孩子可能习惯把话憋在心里，或容易用对抗代替沟通，长期会影响学习配合度。", tips: ["每天固定 15 分钟亲子聊天时间，先倾听不打断，再给出建议。","教孩子用便签、日记或语音消息表达不便当面说的事。","把「命令式」语言改成「选择题」，例如「你想先写数学还是先背英语？」。"] } },
      { key: "效能力", high: { msg: "孩子学习效率高，能用更少时间完成同等任务，有余力进行拓展和休息。", tips: ["教孩子列每日任务清单，练习「先难后易」的排序策略。","引入番茄钟，让孩子体验时间块带来的掌控感。","鼓励孩子定期优化学习流程，找到最适合自己的节奏。"] }, low: { msg: "孩子做事容易拖沓，作业耗时过长，会影响睡眠、情绪和后续学习投入。", tips: ["固定每天的学习时段，形成「到点就学」的条件反射。","把作业拆成 25 分钟的小块，完成一块休息 5 分钟。","减少学习区域的电子产品和玩具干扰，书桌只放当前科目资料。","睡前 5 分钟和孩子一起复盘当天任务完成情况。"] } },
      { key: "自控力", high: { msg: "孩子具备较强的自我管理能力，能够主动完成学习任务，家长可以适当放手。", tips: ["让孩子自己制定学习契约，家长只做监督者和鼓励者。","逐步扩大自主权，比如让孩子决定周末学习顺序。","引导孩子把自律迁移到新领域（运动、阅读、兴趣）。"] }, low: { msg: "孩子目前对外部监督依赖较强，自律习惯尚未稳定，需要循序渐进的培养。", tips: ["用可视化打卡表记录每日学习任务，完成即打勾。","把大目标拆成小目标，每完成一个小目标给予即时反馈。","移除明显干扰源，如约定电子产品使用时段和时长。","先抓一项核心习惯（如按时完成作业），稳定后再叠加新习惯。"] } },
      { key: "主角力", high: { msg: "孩子有主角意识，愿意主动为自己的学习和生活负责，不需要家长反复催促。", tips: ["给孩子一个小项目（如策划一次家庭出游或班级活动），让他承担完整结果。","让孩子当「小老师」，把学到的知识讲给家人或同学听。","鼓励孩子记录成长日记，定期回顾目标和进步。"] }, low: { msg: "孩子目前较被动，习惯等待安排，需要帮助他建立「我是自己学习的第一责任人」的意识。", tips: ["让孩子自己设定一个可达成的学习目标，并自己决定完成方式。","允许孩子承担自然结果，比如忘带作业让他自己面对老师的反馈。","给孩子在班级或家庭中一个具体角色（领读员、植物管理员）。","用提问代替指令：「你觉得这件事怎么安排比较好？」。"] } },
      { key: "专注力", high: { msg: "孩子专注度好，能够进行深度学习，这是学业持续优秀的核心保障。", tips: ["适当增加挑战性任务，帮助孩子进入心流状态。","鼓励孩子进行长文阅读、棋类、乐器等需要持续专注的活动。","保护专注时段，减少无意义的打断。"] }, low: { msg: "孩子容易分心，学习效率受影响，需要通过环境和训练逐步提升。", tips: ["一次只做一科作业，桌面只放当前科目资料。","使用 25 + 5 番茄钟，让孩子体验短时间的全神贯注。","减少多任务切换，避免边写作业边听故事或看视频。","通过背诵、拼图、舒尔特方格等练习提升专注耐力。"] } },
      { key: "创富力", high: { msg: "孩子有自己的兴趣或天赋方向，这是内驱力和未来职业定位的重要起点。", tips: ["把兴趣转化为学科项目，例如用数学做理财游戏、用语文写小说。","鼓励孩子参加相关比赛或社团，看见自己的可能性。","保护孩子的好奇心，允许他在安全范围内试错。"] }, low: { msg: "孩子尚未明显展现出热爱领域，需要更多尝试和体验来发现天赋。", tips: ["提供多元体验：科学实验、手工、音乐、运动、编程等。","观察孩子在哪类活动中能长时间投入且不喊累，那可能就是天赋信号。","把学科知识和孩子日常兴趣结合，比如用他喜欢的动漫人物学英语单词。","帮助孩子记录「高光时刻」，逐步看见自己的优势。"] } },
      { key: "抗挫力", high: { msg: "孩子面对挫折时能保持积极心态，这种复原力是长期学习和事业成功的重要保障。", tips: ["适当增加有挑战性的竞赛或任务，让孩子积累成功经验。","引导孩子用「这次我学到了什么」代替「我又失败了」。","分享名人或家人克服挫折的故事，强化成长型思维。"] }, low: { msg: "孩子在遇到困难或失利时容易气馁，可能会回避挑战，影响学习突破。", tips: ["用成长型思维语言反馈：「你只是还没掌握，不是学不会」。","把大考、大目标拆成阶段性小目标，让孩子体验成功。","在孩子失败时先共情，再一起分析下一步怎么做。","通过运动、棋类等需要反复练习的活动培养耐受力。"] } },
      { key: "亲和力", high: { msg: "孩子具有让人舒服的亲和力，容易获得他人帮助，在团队合作中如鱼得水。", tips: ["让孩子在合作学习中发挥「润滑剂」作用，协调小组分工。","教孩子具体化赞美，如「你刚才的解题思路很清晰」。","引导孩子关注他人情绪，培养同理心。"] }, low: { msg: "孩子在人际互动中可能不够柔和，容易无意中伤害关系或被孤立。", tips: ["练习微笑、眼神交流和倾听，不打断别人说话。","通过绘本、电影讨论不同角色的感受，提升共情能力。","在小组活动中约定「轮流发言」和「不打断」规则。","教孩子用「我句式」表达不满，例如「我不喜欢被抢话」。"] } },
      { key: "学习力", high: { msg: "孩子热爱学习，内驱力强，这是学业持续领先的发动机。", tips: ["拓展阅读面和跨学科项目，满足孩子的求知欲。","让孩子当小老师，把学会的内容讲出来，加深理解。","鼓励孩子参加学科竞赛或研究性学习，保持挑战性。"] }, low: { msg: "孩子目前对学习缺乏热情或信心，需要从成就感入手重新建立连接。", tips: ["找到孩子的「最近发展区」，任务难度略高于当前水平，跳一跳够得着。","把大目标拆成小目标，每完成一步及时给予正向反馈。","帮助孩子发现某一学科的趣味点或实用价值。","减少批评，多关注努力过程，让孩子体验「我会了」的成就感。"] } },

    ];

    // 能力 key 列表（与 index.html 一致，用于绘制彩虹图 X 轴标签）
    const abilities = ABILITIES_DATA.map(ab => ({ key: ab.key }));

    // 绘制生命彩虹图（折线图，与家长端 index.html 的 drawChart 逻辑一致）
    function drawChart(canvas, name, scores, avg) {
      const wrap = canvas.parentElement;
      const dpr = window.devicePixelRatio || 1;
      const cssWidth = wrap.clientWidth;
      const cssHeight = wrap.clientHeight;
      canvas.width = cssWidth * dpr;
      canvas.height = cssHeight * dpr;
      canvas.style.width = cssWidth + "px";
      canvas.style.height = cssHeight + "px";

      const isNarrow = cssWidth < 500;
      const axisFont = isNarrow ? "11px Microsoft YaHei, sans-serif" : "13px Microsoft YaHei, sans-serif";
      const titleFont = isNarrow ? "bold 15px Microsoft YaHei, sans-serif" : "bold 17px Microsoft YaHei, sans-serif";
      const axisTitleFont = isNarrow ? "bold 12px Microsoft YaHei, sans-serif" : "bold 14px Microsoft YaHei, sans-serif";
      const pointRadius = isNarrow ? 4 : 6;
      const mainLineWidth = isNarrow ? 2.5 : 3.5;

      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, cssWidth, cssHeight);

      // 白色背景
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, cssWidth, cssHeight);

      const padding = isNarrow
        ? { top: 52, right: 28, bottom: 110, left: 42 }
        : { top: 60, right: 40, bottom: 94, left: 54 };
      const chartW = cssWidth - padding.left - padding.right;
      const chartH = cssHeight - padding.top - padding.bottom;
      const chartLeft = padding.left;
      const chartTop = padding.top;
      const chartRight = chartLeft + chartW;
      const chartBottom = chartTop + chartH;

      const yMax = 10;
      const yMin = 0;

      function yToPx(v) {
        return chartBottom - ((v - yMin) / (yMax - yMin)) * chartH;
      }
      function xToPx(i) {
        return chartLeft + (i / (scores.length - 1)) * chartW;
      }

      // 黄色背景
      ctx.fillStyle = "#fff176";
      ctx.fillRect(chartLeft, chartTop, chartW, chartH);

      // 网格线
      ctx.strokeStyle = "rgba(0,0,0,0.12)";
      ctx.lineWidth = 1;
      for (let y = yMin; y <= yMax; y++) {
        const yy = yToPx(y);
        ctx.beginPath();
        ctx.moveTo(chartLeft, yy);
        ctx.lineTo(chartRight, yy);
        ctx.stroke();
      }

      // 坐标轴
      ctx.strokeStyle = "#333";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(chartLeft, chartTop);
      ctx.lineTo(chartLeft, chartBottom);
      ctx.lineTo(chartRight, chartBottom);
      ctx.stroke();

      // Y 轴标签 + 竖轴标题
      ctx.fillStyle = "#333";
      ctx.font = axisFont;
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      for (let y = yMin; y <= yMax; y++) {
        ctx.fillText(y, chartLeft - 8, yToPx(y));
      }
      ctx.save();
      ctx.translate(isNarrow ? 12 : 14, chartTop + chartH / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.textAlign = "center";
      ctx.font = axisTitleFont;
      ctx.fillText("得分", 0, 0);
      ctx.restore();

      // X 轴标签
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.save();
      const labels = abilities.map(ab => ab.key);
      labels.forEach((label, i) => {
        const x = xToPx(i);
        if (isNarrow) {
          ctx.save();
          ctx.translate(x, chartBottom + 8);
          ctx.rotate(-Math.PI / 2);
          ctx.textAlign = "right";
          ctx.textBaseline = "middle";
          ctx.fillText(label, 0, 0);
          ctx.restore();
        } else {
          ctx.fillText(label, x, chartBottom + 10);
        }
      });
      ctx.restore();
      // 横轴标题
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.font = axisTitleFont;
      ctx.fillText("能力维度", chartLeft + chartW / 2, chartBottom + (isNarrow ? 72 : 34));

      // 标准线（固定在 7 分）
      const baselineY = yToPx(7);
      ctx.setLineDash([8, 6]);
      ctx.strokeStyle = "#e63946";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(chartLeft, baselineY);
      ctx.lineTo(chartRight, baselineY);
      ctx.stroke();
      ctx.setLineDash([]);

      // 折线
      ctx.strokeStyle = "#0d7377";
      ctx.lineWidth = mainLineWidth;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.beginPath();
      scores.forEach((s, i) => {
        const x = xToPx(i);
        const y = yToPx(s);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // 数据点
      scores.forEach((s, i) => {
        const x = xToPx(i);
        const y = yToPx(s);
        ctx.beginPath();
        ctx.arc(x, y, pointRadius, 0, Math.PI * 2);
        ctx.fillStyle = "#0d7377";
        ctx.fill();
        ctx.lineWidth = isNarrow ? 2 : 3;
        ctx.strokeStyle = "#fff";
        ctx.stroke();

        ctx.fillStyle = "#0d7377";
        ctx.font = isNarrow ? "bold 11px Microsoft YaHei, sans-serif" : "bold 14px Microsoft YaHei, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.fillText(s, x, y - (isNarrow ? 5 : 8));
      });

      // 标题
      ctx.fillStyle = "#333";
      ctx.font = titleFont;
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.fillText(`${name}的生命彩虹图`, cssWidth / 2, isNarrow ? 12 : 18);
    }

    // 打开某条记录的分析报告
    function openReport(id) {
      const r = allRecords.find(x => x.id === id);
      if (!r) { alert("未找到该记录"); return; }
      renderReport(r);
    }

    // 渲染完整分析报告（还原家长端逻辑）
    function renderReport(r) {
      currentReport = r;
      document.getElementById("reportTitle").textContent = r.childName + " 的天赋分析报告";
      document.getElementById("reportSub").textContent =
        (r.phone ? "手机：" + r.phone + "　" : "") +
        (r.source ? "来源：" + r.source + "　" : "") +
        "提交：" + new Date(r.submittedAt).toLocaleString("zh-CN", { timeZone: "Asia/Shanghai" });

      const scores = r.scores;
      const avg = r.avgScore;
      const std = Math.sqrt(scores.reduce((sum, s) => sum + Math.pow(s - avg, 2), 0) / scores.length);
      const balanceText = std <= 1.2
        ? "各项能力发展较为均衡，差异较小。"
        : "各项能力波动较大，建议优先补齐明显短板，同时巩固优势。";
      let levelText = "";
      if (avg >= 8.5) levelText = "整体表现优秀";
      else if (avg >= 7) levelText = "整体表现良好";
      else if (avg >= 5.5) levelText = "整体表现中等偏上";
      else levelText = "整体还有较大提升空间";

      // 三才判定
      const shuaiAvg = ((scores[11] + scores[5] + scores[3]) / 3);
      const jiangAvg = ((scores[0] + scores[1] + scores[2]) / 3);
      const huiAvg = ((scores[6] + scores[10] + scores[4]) / 3);
      const talentTypes = [
        { name: "帅才", avg: shuaiAvg, abilities: "领导力、主角力、效能力", desc: "帅才型孩子天生具有领袖气质，做事高效、目标明确、对自己有要求。他们善于带领团队、制定目标并推动执行，是天生的组织者和决策者。建议：多给孩子承担项目负责人的机会（如小组长、活动策划），在挑战中锻炼统筹与决策能力；同时注意培养耐心与倾听，避免因过于强势而忽略他人感受。" },
        { name: "将才", avg: jiangAvg, abilities: "贵人力、幸福力、沟通力", desc: "将才型孩子情商高、人缘好，擅长与人打交道，能轻松获得老师和同学的喜爱。他们善于凝聚人心、协调资源、化解矛盾，是天生的外交官。建议：发挥孩子的社交优势担任班级联络或小组协调角色，通过沟通表达来带动学习与合作；同时注意深化思维深度，避免浮于表面的人际关系。" },
        { name: "慧才", avg: huiAvg, abilities: "专注力、学习力、自控力", desc: "慧才型孩子具备极强的学习能力和自律精神，能沉下心钻研，在学术上表现突出。他们善于独立思考、深度学习和自我管理，是天生的学者。建议：为孩子提供丰富的学习资源和挑战性内容（如竞赛、课题研究），同时鼓励其参与团队活动，避免因过度专注学业而忽略人际交往与表达能力的培养。" }
      ];
      talentTypes.sort((a, b) => b.avg - a.avg);
      const topTalent = talentTypes[0];
      const talentCls = topTalent.name === "帅才" ? "shuai" : (topTalent.name === "将才" ? "jiang" : "hui");

      // 优势 / 弱势能力
      const indexed = scores.map((s, i) => ({ score: s, index: i }));
      const strengths = indexed.filter(x => x.score >= 8).sort((a, b) => b.score - a.score).slice(0, 3);
      const weaknesses = indexed.filter(x => x.score <= 5).sort((a, b) => a.score - b.score).slice(0, 3);

      // 分数表格
      const scoreRow = ABILITY_NAMES.map((_, idx) => {
        const s = scores[idx] ?? "-";
        const cls = s >= 8 ? "score-high" : (s <= 5 ? "score-low" : "");
        return `<td class="${cls}">${s}</td>`;
      }).join("");

      let html = `
        <div class="report-summary">
          <p><strong>${r.childName}</strong>的平均分为 <strong>${avg.toFixed(1)}</strong> 分，${levelText}。</p>
          <p>${balanceText} 下方根据优势能力和弱势能力给出与学习相关的具体建议。</p>
        </div>

        <div class="report-talent">
          <h3>天赋类型判定</h3>
          <span class="talent-name ${talentCls}">${topTalent.name}</span>
          <div class="talent-info">
            核心能力：<strong>${topTalent.abilities}</strong>　均分：<strong>${topTalent.avg.toFixed(1)}</strong><br>
            ${topTalent.desc}
          </div>
        </div>

        <div class="chart-wrap">
          <h3>生命彩虹图</h3>
          <canvas id="rainbowChart"></canvas>
        </div>

        <div class="report-section" style="overflow-x:auto;">
          <h3>12 灵种得分一览</h3>
          <table style="width:100%;border-collapse:collapse;font-size:13px;min-width:620px;">
            <tr><th style="padding:8px;text-align:center;background:#f8f9fa;">能力</th>${ABILITY_NAMES.map(n => `<th style="padding:8px;text-align:center;background:#f8f9fa;font-weight:600;">${n}</th>`).join("")}</tr>
            <tr><th style="padding:8px;text-align:center;background:#f8f9fa;">得分</th>${scoreRow}</tr>
          </table>
        </div>

        <div class="report-section">
          <h3>优势能力分析（得分 ≥ 8 分）</h3>
          ${strengths.length === 0
            ? '<div class="report-empty">目前没有得分达到 8 分的明显优势项。建议先集中提升 1-2 项较接近 8 分的能力，帮助孩子建立成就感。</div>'
            : strengths.map(x => buildAbilityCard(ABILITIES_DATA[x.index], x.score, "strength")).join("")}
        </div>

        <div class="report-section">
          <h3>弱势能力分析（得分 ≤ 5 分）</h3>
          ${weaknesses.length === 0
            ? '<div class="report-empty">目前没有得分低于 5 分的明显弱势项。建议保持当前节奏，在 6-7 分的项目上继续精进。</div>'
            : weaknesses.map(x => buildAbilityCard(ABILITIES_DATA[x.index], x.score, "weakness")).join("")}
        </div>

        <div class="report-section report-goals">
          <h3>近期发展目标</h3>
          <ul>
            ${weaknesses.length > 0
              ? `<li><strong>短期（1-3个月）：</strong>重点提升${weaknesses.map(x => ABILITIES_DATA[x.index].key).join("、")}，目标每项提升 1-2 分。</li>`
              : `<li><strong>短期（1-3个月）：</strong>巩固现有优势，在 6-7 分的中等能力中选择 1 项集中突破。</li>`}
            <li><strong>中期（3-6个月）：</strong>将薄弱项全部提升到 6 分以上，优势项保持 8 分以上。</li>
            <li><strong>长期（6-12个月）：</strong>12 项能力均衡发展，平均分达到 7 分以上，形成孩子独特的核心竞争力。</li>
          </ul>
        </div>
      `;

      document.getElementById("reportBody").innerHTML = html;
      document.getElementById("reportOverlay").classList.add("active");
      // 弹窗显示后再绘制生命彩虹图（此时 chart-wrap 才有实际宽度）
      const chartCanvas = document.getElementById("rainbowChart");
      if (chartCanvas) setTimeout(() => drawChart(chartCanvas, r.childName, scores, avg), 50);
    }

    // 生成单个能力分析卡片（与家长端 buildResultCard 一致）
    function buildAbilityCard(ab, score, type) {
      const info = type === "strength" ? ab.high : ab.low;
      const label = type === "strength" ? "优势" : "待提升";
      return `
        <div class="ability-card ${type}">
          <h4>${ab.key}（${score} 分）<span class="badge ${type}">${label}</span></h4>
          <p>${info.msg}</p>
          <ul>${info.tips.map(tip => `<li>${tip}</li>`).join("")}</ul>
        </div>
      `;
    }

    // 当前打开的报告记录（供下载使用）
    let currentReport = null;

    // 下载报告为 PNG 图片
    window.downloadReport = async function() {
      const btn = document.getElementById("downloadReportBtn");
      if (!currentReport) { alert("请先打开报告再下载"); return; }
      if (!window.html2canvas) { alert("图片组件未加载，请检查网络后重试"); return; }
      btn.disabled = true;
      const origText = btn.textContent;
      btn.textContent = "正在生成图片…";
      try {
        const modal = document.querySelector(".report-modal");
        // 截图时隐藏下载/关闭按钮，避免出现在图片里
        const head = document.querySelector(".report-modal-head");
        const headActions = head.querySelector(".report-head-actions");
        const actionsDisplay = headActions.style.display;
        headActions.style.display = "none";
        await new Promise(r => setTimeout(r, 100));

        const canvas = await html2canvas(modal, {
          backgroundColor: "#ffffff",
          scale: 2,
          useCORS: true,
          logging: false
        });
        headActions.style.display = actionsDisplay;

        const link = document.createElement("a");
        const safeName = (currentReport.childName || "报告").replace(/[\\/:*?"<>|]/g, "_");
        const date = new Date().toISOString().slice(0, 10);
        link.download = `${safeName}_天赋分析报告_${date}.png`;
        link.href = canvas.toDataURL("image/png");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (err) {
        alert("下载失败：" + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = origText;
      }
    };

    // 下载报告为 PDF
    window.downloadReportPdf = async function() {
      const btn = document.getElementById("downloadPdfBtn");
      if (!currentReport) { alert("请先打开报告再下载"); return; }
      if (!window.html2canvas || !window.jspdf) { alert("PDF 组件未加载，请检查网络后重试"); return; }
      btn.disabled = true;
      const origText = btn.textContent;
      btn.textContent = "正在生成 PDF…";
      try {
        const modal = document.querySelector(".report-modal");
        // 截图时隐藏下载/关闭按钮，避免出现在 PDF 里
        const head = document.querySelector(".report-modal-head");
        const headActions = head.querySelector(".report-head-actions");
        const actionsDisplay = headActions.style.display;
        headActions.style.display = "none";
        await new Promise(r => setTimeout(r, 100));

        const canvas = await html2canvas(modal, {
          backgroundColor: "#ffffff",
          scale: 2,
          useCORS: true,
          logging: false
        });
        headActions.style.display = actionsDisplay;

        const imgData = canvas.toDataURL("image/jpeg", 0.95);
        const pdf = new jspdf.jsPDF("p", "mm", "a4");
        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();
        const imgH = canvas.height * pageW / canvas.width;
        let heightLeft = imgH;
        let position = 0;
        pdf.addImage(imgData, "JPEG", 0, position, pageW, imgH);
        heightLeft -= pageH;
        while (heightLeft > 0) {
          position -= pageH;
          pdf.addPage();
          pdf.addImage(imgData, "JPEG", 0, position, pageW, imgH);
          heightLeft -= pageH;
        }
        const safeName = (currentReport.childName || "报告").replace(/[\\/:*?"<>|]/g, "_");
        const date = new Date().toISOString().slice(0, 10);
        pdf.save(`${safeName}_天赋分析报告_${date}.pdf`);
      } catch (err) {
        alert("PDF 下载失败：" + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = origText;
      }
    };

    // 关闭报告
    window.closeReport = function() {
      document.getElementById("reportOverlay").classList.remove("active");
      document.getElementById("reportBody").innerHTML = "";
    };    // 点击遮罩关闭
    document.getElementById("reportOverlay").addEventListener("click", (e) => {
      if (e.target === document.getElementById("reportOverlay")) closeReport();
    });
  </script>

  <!-- 分析报告弹窗 -->
  <div class="report-overlay" id="reportOverlay">
    <div class="report-modal">
      <div class="report-modal-head">
        <div>
          <h2 id="reportTitle">天赋分析报告</h2>
          <div class="sub" id="reportSub"></div>
        </div>
        <div class="report-head-actions">
          <button class="btn-download-report" id="downloadReportBtn" onclick="downloadReport()">⬇ 下载图片</button>
          <button class="btn-download-report" id="downloadPdfBtn" onclick="downloadReportPdf()">⬇ 下载 PDF</button>
          <button class="report-close" onclick="closeReport()">关闭</button>
        </div>
      </div>
      <div class="report-body" id="reportBody"></div>
    </div>
  </div>
</body>
</html>
