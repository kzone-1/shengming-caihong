<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>十二灵种生命彩虹图测试</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --primary: #0d7377;
      --primary-dark: #094f52;
      --accent: #ff6b6b;
      --yellow: #fff176;
      --bg: #f8f9fa;
      --card: #ffffff;
      --text: #333333;
      --muted: #666666;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }
    header {
      text-align: center;
      margin-bottom: 28px;
    }
    header h1 {
      margin: 0;
      font-size: 28px;
      color: var(--primary-dark);
    }
    header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
    }
    section {
      background: var(--card);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    h2 {
      margin: 0 0 18px;
      font-size: 20px;
      color: var(--primary-dark);
      border-left: 4px solid var(--primary);
      padding-left: 12px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .form-group input[type="text"],
    .form-group input[type="tel"] {
      width: 100%;
      max-width: 320px;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }
    .ability-card {
      border: 1px solid #ececec;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
      background: #fafafa;
      transition: box-shadow 0.2s;
    }
    .form-group input[type="text"].highlight,
    .form-group input[type="tel"].highlight {
      border-color: #e63946;
      background: #fff5f5;
      box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.25);
      animation: pulse-highlight 0.6s ease-in-out 3;
    }
    .ability-card.highlight {
      border-color: #e63946;
      background: #fff5f5;
      box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.25);
      animation: pulse-highlight 0.6s ease-in-out 3;
    }
    @keyframes pulse-highlight {
      0%, 100% { box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.25); }
      50% { box-shadow: 0 0 0 8px rgba(230, 57, 70, 0.08); }
    }
    .ability-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .ability-name {
      font-weight: 700;
      font-size: 16px;
      color: var(--primary-dark);
    }
    .ability-desc {
      margin: 8px 0 12px;
      font-size: 14px;
      color: var(--muted);
    }
    .score-control {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .score-label {
      font-weight: 600;
      font-size: 14px;
      color: var(--muted);
      white-space: nowrap;
    }
    .score-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .score-btn {
      width: 48px;
      height: 48px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      background: #fff;
      color: #555;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .score-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: #eef7f7;
    }
    .score-btn.s0, .score-btn.s1, .score-btn.s2 { border-color: #f5c6cb; color: #c0392b; }
    .score-btn.s3, .score-btn.s4 { border-color: #ffeaa7; color: #e67e22; }
    .score-btn.s5, .score-btn.s6 { border-color: #f9e79f; color: #b7950b; }
    .score-btn.s7, .score-btn.s8 { border-color: #a9dfbf; color: #1e8449; }
    .score-btn.s9, .score-btn.s10 { border-color: #7dcea0; color: #1e8449; }

    .score-btn.s0.selected, .score-btn.s1.selected, .score-btn.s2.selected {
      background: #e74c3c; border-color: #e74c3c; color: #fff;
    }
    .score-btn.s3.selected, .score-btn.s4.selected {
      background: #e67e22; border-color: #e67e22; color: #fff;
    }
    .score-btn.s5.selected, .score-btn.s6.selected {
      background: #f1c40f; border-color: #f1c40f; color: #333;
    }
    .score-btn.s7.selected, .score-btn.s8.selected {
      background: #2ecc71; border-color: #2ecc71; color: #fff;
    }
    .score-btn.s9.selected, .score-btn.s10.selected {
      background: #27ae60; border-color: #27ae60; color: #fff;
    }

    .score-pick {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 6px;
    }
    .score-pick-label {
      font-size: 13px;
      color: var(--muted);
    }
    .score-pick-value {
      font-weight: 700;
      font-size: 18px;
      color: var(--primary);
      min-width: 24px;
      text-align: center;
    }

    @media (max-width: 640px) {
      .score-btn {
        width: 42px;
        height: 42px;
        font-size: 16px;
        border-radius: 8px;
      }
      .score-buttons { gap: 6px; }
      .score-pick-value { font-size: 18px; }
    }
    .btn-primary, .btn-secondary {
      display: inline-block;
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary {
      background: #e9ecef;
      color: var(--text);
      margin-top: 12px;
    }
    .btn-secondary:hover { background: #dde2e6; }
    .hidden { display: none !important; }

    /* ===== 历史记录弹窗 ===== */
    .btn-history {
      margin-left: 12px;
    }
    .history-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
      z-index: 1000;
      overflow-y: auto;
    }
    .history-overlay.active { display: flex; }
    .history-modal {
      background: #fff;
      border-radius: 12px;
      max-width: 640px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      position: relative;
    }
    .history-modal h2 { margin: 0 0 6px; font-size: 20px; color: var(--primary-dark); }
    .history-modal .history-sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    .history-close {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      font-size: 28px;
      line-height: 1;
      color: #888;
      cursor: pointer;
    }
    .history-close:hover { color: #333; }
    .history-search {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .history-search input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    .history-search input:focus { border-color: var(--primary); }
    .history-search button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    .history-search button:hover { background: var(--primary-dark); }
    .history-list { max-height: 380px; overflow-y: auto; }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid #e3e3e3;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .history-item:hover { background: #f2fafa; border-color: var(--primary); }
    .history-item .hi-main { flex: 1; min-width: 0; }
    .history-item .hi-name { font-weight: 700; font-size: 15px; color: var(--text); }
    .history-item .hi-time { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .history-item .hi-right { text-align: right; flex-shrink: 0; }
    .history-item .hi-avg { font-weight: 700; font-size: 18px; color: var(--primary); }
    .history-item .hi-type { font-size: 12px; color: #888; }
    .history-empty { text-align: center; color: var(--muted); padding: 30px 0; }
    .history-loading { text-align: center; color: var(--muted); padding: 30px 0; }
    .history-error { text-align: center; color: #c0392b; padding: 20px 0; }

    .summary-box {
      background: #eef7f7;
      border-left: 4px solid var(--primary);
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 18px;
    }
    .summary-box p { margin: 6px 0; }
    .summary-box strong { color: var(--primary-dark); }

    .table-wrap { overflow-x: auto; margin-bottom: 22px; }
    #scoreTable {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 640px;
    }
    #scoreTable th, #scoreTable td {
      border: 1px solid #333;
      padding: 8px 6px;
      text-align: center;
      white-space: nowrap;
    }
    #scoreTable th {
      background: #f0f0f0;
      font-weight: 700;
    }
    #scoreTable .avg-cell {
      background: var(--yellow);
      font-weight: 700;
    }
    #scoreTable .score-cell { font-weight: 700; }

    .chart-wrap {
      position: relative;
      height: 540px;
      margin-bottom: 22px;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
    }
    .chart-hint {
      position: absolute;
      bottom: 4px;
      right: 10px;
      font-size: 12px;
      color: #999;
      pointer-events: none;
    }
    #rainbowChart {
      display: block;
      width: 100%;
      height: 100%;
    }

    .analysis h3 {
      margin: 22px 0 12px;
      font-size: 18px;
      color: var(--primary-dark);
    }
    .ability-result {
      border-left: 4px solid var(--primary);
      background: #fafafa;
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 14px;
    }
    .ability-result.strength { border-left-color: #28a745; background: #f0fff4; }
    .ability-result.weakness { border-left-color: var(--accent); background: #fff5f5; }
    .ability-result h4 {
      margin: 0 0 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
    }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 13px;
      color: #fff;
      font-weight: 700;
    }
    .badge.strength { background: #28a745; }
    .badge.weakness { background: var(--accent); }
    .ability-result p { margin: 6px 0; font-size: 14px; }
    .ability-result ul { margin: 6px 0; padding-left: 20px; font-size: 14px; }
    .ability-result li { margin-bottom: 4px; }

    .talent-box {
      background: linear-gradient(135deg, #fff9e6, #fff3cd);
      border: 2px solid #f0c040;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 22px;
      text-align: center;
    }
    .talent-box h3 {
      margin: 0 0 10px;
      font-size: 20px;
      color: #b8860b;
    }
    .talent-type {
      display: inline-block;
      font-size: 32px;
      font-weight: 900;
      color: #b8860b;
      padding: 6px 24px;
      border: 3px solid #f0c040;
      border-radius: 12px;
      background: #fff;
      margin: 8px 0;
    }
    .talent-desc {
      font-size: 15px;
      color: #666;
      margin: 10px 0 0;
      line-height: 1.8;
    }
    .talent-detail {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .talent-item {
      font-size: 14px;
      color: #555;
    }
    .talent-item strong {
      color: #b8860b;
    }

    @media (max-width: 640px) {
      .container { padding: 14px; }
      header h1 { font-size: 22px; }
      section { padding: 16px; }
      .chart-wrap { height: 420px; }
    }
    /* 图片放大 lightbox */
    .lightbox-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.88);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      cursor: zoom-out;
    }
    .lightbox-overlay.active { display: flex; }
    .lightbox-overlay img {
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 8px 36px rgba(0,0,0,0.5);
    }
    .lightbox-close {
      position: fixed;
      top: 16px;
      right: 24px;
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .lightbox-close:hover { background: rgba(255,255,255,0.3); }

    @media print {
      body { background: #fff; }
      section { box-shadow: none; border: 1px solid #ddd; }
      .btn-primary, .btn-secondary, .score-control input[type="range"], #inputSection { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>十二灵种生命彩虹图测试</h1>
      <p>根据 12 项能力测评，绘制孩子的生命彩虹图，并给出与学习相关的培养建议</p>
      <p id="sourceHint" style="display:none;margin-top:6px;font-size:13px;color:#0d7377;"></p>
    </header>

    <section id="inputSection">
      <h2>【天赋测试】生命彩虹图</h2>
      <div class="form-group">
        <label for="childName">孩子姓名</label>
        <input type="text" id="childName" placeholder="请输入孩子姓名" />
      </div>
      <div class="form-group">
        <label for="parentPhone">报名课程手机号</label>
        <input type="tel" id="parentPhone" placeholder="请输入11位手机号" maxlength="11" inputmode="numeric" />
      </div>
      <div id="abilityInputs"></div>
      <button id="generateBtn" class="btn-primary">生成生命彩虹图</button>
      <button id="historyBtn" class="btn-secondary btn-history">查看历史记录</button>
    </section>

    <section id="resultSection" class="hidden">
      <h2>【天赋分析报告】</h2>
      <div class="summary-box" id="summaryBox"></div>

      <div class="table-wrap">
        <table id="scoreTable"></table>
      </div>

      <div class="chart-wrap">
        <canvas id="rainbowChart"></canvas>
        <span class="chart-hint">点击图片可放大查看</span>
      </div>

      <div class="analysis" id="analysis"></div>

      <button id="saveBtn" class="btn-secondary">保存结果为图片</button>
      <button id="savePdfBtn" class="btn-secondary">保存结果为 PDF</button>
      <div id="submitStatus" style="margin-top:12px;font-size:14px;"></div>
    </section>
  </div>

  <div class="lightbox-overlay" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">&times;</button>
    <img id="lightboxImg" alt="放大查看生命彩虹图" />
  </div>

  <!-- 历史记录弹窗 -->
  <div class="history-overlay" id="historyOverlay">
    <div class="history-modal">
      <button class="history-close" id="historyClose">&times;</button>
      <h2>历史记录查询</h2>
      <p class="history-sub">输入报名课程手机号，查询该手机号下的全部历史测试记录</p>
      <div class="history-search">
        <input type="tel" id="historyPhone" placeholder="请输入11位手机号" maxlength="11" inputmode="numeric" />
        <button id="historySearchBtn">查询</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>
  <script>
    // === Supabase 配置（复制你的 Supabase 项目 URL 和 anon key 替换下面两个值）===
    const SUPABASE_URL = 'https://xviogqxhmptrrogsqmgk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2aW9ncXhobXB0cnJvZ3NxbWdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0Mzk4MzgsImV4cCI6MjEwMjAxNTgzOH0.wi9qS0rBJuOtAOD14vxpfTh2rh0dzzJQRNKEcwrx5QE';
    let supabaseClient = null;
    try { supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) {}

    // 读取专属链接来源参数 ?c=xxx（助教专属邀请码，URL 中不暴露助教姓名），随提交记录一起入库
    // 通过 code 反查 assistants 表得到助教姓名，作为 source 保存（便于后台按助教统计）
    const inviteCode = (new URLSearchParams(location.search).get("c") || "").trim().slice(0, 50);
    let sourceCode = ""; // 助教姓名，提交时写入 source
    if (inviteCode) {
      // 异步反查助教（不阻塞页面使用）
      if (supabaseClient) {
        supabaseClient.from('assistants').select('name').eq('code', inviteCode).maybeSingle()
          .then(({ data, error }) => {
            if (!error && data && data.name) {
              sourceCode = data.name;
            }
          }).catch(() => {});
      }
    }

    const abilities = [
      {
        key: "贵人力",
        desc: "孩子如果在学校里面能够获得老师的关注和喜欢，对孩子来讲是巨大的优势，长大后也会获得未来领导的器重。请根据孩子是否容易被他人器重、获得师长或同伴认可的程度打分。",
        high: {
          msg: "这是孩子的强项，说明孩子在学校容易获得老师和同学的喜爱，未来进入职场也更容易得到领导器重。",
          tips: [
            "鼓励孩子主动担任小组长、课代表，增加与老师的正向互动。",
            "教孩子课后整理问题清单，主动向老师请教，把「被喜欢」转化为「被指导」。",
            "在家庭中模拟汇报场景，让孩子学会得体地展示自己的学习成果。"
          ]
        },
        low: {
          msg: "孩子目前在人群中不够突出，容易被忽视，需要帮助他建立与老师和同伴的积极连接。",
          tips: [
            "每天练习一句礼貌问候或课堂举手发言，从「被看见」的小动作开始。",
            "和孩子一起复盘课堂表现，找到能引起老师正向关注的行为。",
            "鼓励孩子参与班级服务（发作业、整理讲台），在服务中积累信任感。"
          ]
        }
      },
      {
        key: "幸福力",
        desc: "孩子是否能够轻松融入集体，并且与各类同学相处融洽，保持较为良好的同学关系。请根据孩子在同伴中是否快乐、是否有稳定朋友打分。",
        high: {
          msg: "孩子人缘好、归属感强，良好的同伴关系能为学习提供情绪缓冲和合作资源。",
          tips: [
            "让孩子在小组学习中担任协调者，带动团队氛围。",
            "通过同伴互评、小组作业，把社交优势转化为学习动力。",
            "引导孩子关注需要帮助的同学，培养利他意识。"
          ]
        },
        low: {
          msg: "孩子在集体中可能感到压力，社交困扰容易影响学习状态和情绪稳定。",
          tips: [
            "多创造同伴一起学习的机会，如约同学一起写作业、做项目。",
            "用角色扮演教孩子换位思考，练习与不同类型同学相处。",
            "从共同兴趣（运动、游戏、阅读）入手，帮助孩子建立至少一个稳定友谊。"
          ]
        }
      },

    function drawChart(canvas, name, scores, avg) {
      const wrap = canvas.parentElement;
      const dpr = window.devicePixelRatio || 1;
      const cssWidth = wrap.clientWidth;
      const cssHeight = wrap.clientHeight;
      canvas.width = cssWidth * dpr;
      canvas.height = cssHeight * dpr;
      canvas.style.width = cssWidth + "px";
      canvas.style.height = cssHeight + "px";

      const isNarrow = cssWidth < 500;
      const axisFont = isNarrow ? "11px Microsoft YaHei, sans-serif" : "13px Microsoft YaHei, sans-serif";
      const titleFont = isNarrow ? "bold 15px Microsoft YaHei, sans-serif" : "bold 17px Microsoft YaHei, sans-serif";
      const axisTitleFont = isNarrow ? "bold 12px Microsoft YaHei, sans-serif" : "bold 14px Microsoft YaHei, sans-serif";
      const pointRadius = isNarrow ? 4 : 6;
      const mainLineWidth = isNarrow ? 2.5 : 3.5;

      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, cssWidth, cssHeight);

      // 白色背景（导出图片时四周有白边）
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, cssWidth, cssHeight);

      const padding = isNarrow
        ? { top: 52, right: 28, bottom: 110, left: 42 }
        : { top: 60, right: 40, bottom: 94, left: 54 };
      const chartW = cssWidth - padding.left - padding.right;
      const chartH = cssHeight - padding.top - padding.bottom;
      const chartLeft = padding.left;
      const chartTop = padding.top;
      const chartRight = chartLeft + chartW;
      const chartBottom = chartTop + chartH;

      const yMax = 10;
      const yMin = 0;

      function yToPx(v) {
        return chartBottom - ((v - yMin) / (yMax - yMin)) * chartH;
      }
      function xToPx(i) {
        return chartLeft + (i / (scores.length - 1)) * chartW;
      }

      // 黄色背景
      ctx.fillStyle = "#fff176";
      ctx.fillRect(chartLeft, chartTop, chartW, chartH);

      // 网格线
      ctx.strokeStyle = "rgba(0,0,0,0.12)";
      ctx.lineWidth = 1;
      for (let y = yMin; y <= yMax; y++) {
        const yy = yToPx(y);
        ctx.beginPath();
        ctx.moveTo(chartLeft, yy);
        ctx.lineTo(chartRight, yy);
        ctx.stroke();
      }

      // 坐标轴
      ctx.strokeStyle = "#333";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(chartLeft, chartTop);
      ctx.lineTo(chartLeft, chartBottom);
      ctx.lineTo(chartRight, chartBottom);
      ctx.stroke();

      // Y 轴标签 + 竖轴标题
      ctx.fillStyle = "#333";
      ctx.font = axisFont;
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      for (let y = yMin; y <= yMax; y++) {
        ctx.fillText(y, chartLeft - 8, yToPx(y));
      }
      // 竖轴标题
      ctx.save();
      ctx.translate(isNarrow ? 12 : 14, chartTop + chartH / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.textAlign = "center";
      ctx.font = axisTitleFont;
      ctx.fillText("得分", 0, 0);
      ctx.restore();

      // X 轴标签
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.save();
      const labels = abilities.map(ab => ab.key);
      labels.forEach((label, i) => {
        const x = xToPx(i);
        if (isNarrow) {
          // 窄屏竖排显示，节省宽度
          ctx.save();
          ctx.translate(x, chartBottom + 8);
          ctx.rotate(-Math.PI / 2);
          ctx.textAlign = "right";
          ctx.textBaseline = "middle";
          ctx.fillText(label, 0, 0);
          ctx.restore();
        } else {
          ctx.fillText(label, x, chartBottom + 10);
        }
      });
      ctx.restore();
      // 横轴标题
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.font = axisTitleFont;
      ctx.fillText("能力维度", chartLeft + chartW / 2, chartBottom + (isNarrow ? 72 : 34));

      // 标准线（固定在 7 分）
      const baselineY = yToPx(7);
      ctx.setLineDash([8, 6]);
      ctx.strokeStyle = "#e63946";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(chartLeft, baselineY);
      ctx.lineTo(chartRight, baselineY);
      ctx.stroke();
      ctx.setLineDash([]);

      // 折线
      ctx.strokeStyle = "#0d7377";
      ctx.lineWidth = mainLineWidth;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.beginPath();
      scores.forEach((s, i) => {
        const x = xToPx(i);
        const y = yToPx(s);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // 数据点
      scores.forEach((s, i) => {
        const x = xToPx(i);
        const y = yToPx(s);
        ctx.beginPath();
        ctx.arc(x, y, pointRadius, 0, Math.PI * 2);
        ctx.fillStyle = "#0d7377";
        ctx.fill();
        ctx.lineWidth = isNarrow ? 2 : 3;
        ctx.strokeStyle = "#fff";
        ctx.stroke();

        ctx.fillStyle = "#0d7377";
        ctx.font = isNarrow ? "bold 11px Microsoft YaHei, sans-serif" : "bold 14px Microsoft YaHei, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.fillText(s, x, y - (isNarrow ? 5 : 8));
      });

      // 标题
      ctx.fillStyle = "#333";
      ctx.font = titleFont;
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.fillText(`${name}的生命彩虹图`, cssWidth / 2, isNarrow ? 12 : 18);
    }

      });
      if (unrated.length > 0) {
        // 先清除所有旧高亮
        document.querySelectorAll(".ability-card.highlight").forEach(c => c.classList.remove("highlight"));
        // 高亮所有未填项
        unrated.forEach(i => {
          const card = document.getElementById("card-" + (i - 1));
          if (card) card.classList.add("highlight");
          // 3 秒后自动取消高亮
          setTimeout(() => { if (card) card.classList.remove("highlight"); }, 3500);
        });
        // 跳转到第一个未填项
        const firstCard = document.getElementById("card-" + (unrated[0] - 1));
        if (firstCard) {
          firstCard.scrollIntoView({ behavior: "smooth", block: "center" });
        }
        const names = unrated.map(i => abilities[i - 1].key).join("、");
        alert(`还有 ${unrated.length} 项能力未打分：${names}。\n已为您跳转到未填项（红色高亮标记），请完成后再生成报告。`);
        return;
      }

      const scores = abilities.map((_, i) => {
        const v = parseInt(document.getElementById(`num-${i}`).value, 10);
        return isNaN(v) ? 0 : Math.max(0, Math.min(10, v));
      });
      const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
      const avgFixed = avg.toFixed(1);

      renderTable(scores, avgFixed);
      renderAnalysis(name, scores, avg);

      const resultSection = document.getElementById("resultSection");
      resultSection.classList.remove("hidden");
      // 等布局完成后再绘制，确保 canvas 尺寸正确
      setTimeout(() => {
        drawChart(document.getElementById("rainbowChart"), name, scores, avg);
        resultSection.scrollIntoView({ behavior: "smooth" });
      }, 50);

      // === 自动提交数据到后端 ===
      const shuaiAvg = (scores[11] + scores[5] + scores[3]) / 3;
      const jiangAvg = (scores[0] + scores[1] + scores[2]) / 3;
      const huiAvg = (scores[6] + scores[10] + scores[4]) / 3;
      const talentType = [
        { name: "帅才", avg: shuaiAvg },
        { name: "将才", avg: jiangAvg },
        { name: "慧才", avg: huiAvg }
      ].sort((a, b) => b.avg - a.avg)[0].name;

      const submitStatus = document.getElementById("submitStatus");
      submitStatus.style.color = "#999";
      submitStatus.textContent = "正在保存测试记录...";

      if (supabaseClient) {
        // 若通过专属链接进入且 sourceCode 尚未反查完成，则在此同步补查一次（保险）
        if (inviteCode && !sourceCode) {
          const { data: a } = await supabaseClient.from('assistants').select('name').eq('code', inviteCode).maybeSingle();
          if (a && a.name) sourceCode = a.name;
        }
        supabaseClient.from('submissions').insert({
          child_name: name,
          phone: phone,
          source: sourceCode,
          scores: scores,
          avg_score: avg,
          talent_type: talentType
        }).then(({ error }) => {
          if (!error) {
            submitStatus.style.color = "#28a745";
            submitStatus.textContent = "测试记录已保存";
          } else {
            submitStatus.style.color = "#999";
            submitStatus.textContent = "记录保存失败（不影响报告查看）";
          }
        }).catch(() => {
          submitStatus.style.color = "#999";
          submitStatus.textContent = "记录保存失败（不影响报告查看）";
        });
      } else {
        submitStatus.style.color = "#999";
        submitStatus.textContent = "（数据库未配置，报告仅本地查看）";
      }
    });

    window.addEventListener("resize", () => {
      const canvas = document.getElementById("rainbowChart");
      if (!canvas.dataset.scores) return;
      const name = canvas.dataset.name;
      const scores = JSON.parse(canvas.dataset.scores);
      const avg = parseFloat(canvas.dataset.avg);
      drawChart(canvas, name, scores, avg);
    });

    function renderTable(scores, avgFixed) {
      const table = document.getElementById("scoreTable");
      let html = "<tr><th>12灵种</th>";
      abilities.forEach(ab => html += `<th>${ab.key}</th>`);
      html += "<th>平均分</th></tr><tr><th>得分</th>";
      scores.forEach(s => html += `<td class="score-cell">${s}</td>`);
      html += `<td class="avg-cell">${avgFixed}</td></tr>`;
      table.innerHTML = html;
    }

    function renderAnalysis(name, scores, avg) {
      const container = document.getElementById("analysis");
      const std = Math.sqrt(scores.reduce((sum, s) => sum + Math.pow(s - avg, 2), 0) / scores.length);
      const balanceText = std <= 1.2
        ? "各项能力发展较为均衡，差异较小。"
        : "各项能力波动较大，建议优先补齐明显短板，同时巩固优势。";

      let levelText = "";
      if (avg >= 8.5) levelText = "整体表现优秀";
      else if (avg >= 7) levelText = "整体表现良好";
      else if (avg >= 5.5) levelText = "整体表现中等偏上";
      else levelText = "整体还有较大提升空间";

      // --- 三才判定 ---
      // 帅才: 领导力(11) + 主角力(5) + 效能力(3)
      const shuaiAvg = ((scores[11] + scores[5] + scores[3]) / 3);
      // 将才: 贵人力(0) + 幸福力(1) + 沟通力(2)
      const jiangAvg = ((scores[0] + scores[1] + scores[2]) / 3);
      // 慧才: 专注力(6) + 学习力(10) + 自控力(4)
      const huiAvg = ((scores[6] + scores[10] + scores[4]) / 3);

      const talentTypes = [
        { name: "帅才", avg: shuaiAvg, abilities: "领导力、主角力、效能力", desc: "帅才型孩子天生具有领袖气质，做事高效、目标明确、对自己有要求。他们善于带领团队、制定目标并推动执行，是天生的组织者和决策者。建议：多给孩子承担项目负责人的机会（如小组长、活动策划），在挑战中锻炼统筹与决策能力；同时注意培养耐心与倾听，避免因过于强势而忽略他人感受。" },
        { name: "将才", avg: jiangAvg, abilities: "贵人力、幸福力、沟通力", desc: "将才型孩子情商高、人缘好，擅长与人打交道，能轻松获得老师和同学的喜爱。他们善于凝聚人心、协调资源、化解矛盾，是天生的外交官。建议：发挥孩子的社交优势担任班级联络或小组协调角色，通过沟通表达来带动学习与合作；同时注意深化思维深度，避免浮于表面的人际关系。" },
        { name: "慧才", avg: huiAvg, abilities: "专注力、学习力、自控力", desc: "慧才型孩子具备极强的学习能力和自律精神，能沉下心钻研，在学术上表现突出。他们善于独立思考、深度学习和自我管理，是天生的学者。建议：为孩子提供丰富的学习资源和挑战性内容（如竞赛、课题研究），同时鼓励其参与团队活动，避免因过度专注学业而忽略人际交往与表达能力的培养。" }
      ];

      talentTypes.sort((a, b) => b.avg - a.avg);
      const topTalent = talentTypes[0];
      // --- 三才判定结束 ---

      const talentHtml = `
        <div class="talent-box">
          <h3>天赋类型判定</h3>
          <div class="talent-type">${topTalent.name}</div>
          <div class="talent-detail">
            <span class="talent-item">核心能力：<strong>${topTalent.abilities}</strong></span>
            <span class="talent-item">均分：<strong>${topTalent.avg.toFixed(1)}</strong></span>
          </div>
          <p class="talent-desc">${topTalent.desc}</p>
        </div>
      `;

      document.getElementById("summaryBox").innerHTML = `
        <p><strong>${name}</strong>的平均分为 <strong>${avg.toFixed(1)}</strong> 分，${levelText}。</p>
        <p>${balanceText} 下方根据优势能力和弱势能力给出与学习相关的具体建议。</p>
      `;

      const indexed = scores.map((s, i) => ({ score: s, index: i }));
      const strengths = indexed.filter(x => x.score >= 8).sort((a, b) => b.score - a.score).slice(0, 3);
      const weaknesses = indexed.filter(x => x.score <= 5).sort((a, b) => a.score - b.score).slice(0, 3);

      let html = talentHtml;
      html += "<h3>优势能力分析（得分 ≥ 8 分）</h3>";
      if (strengths.length === 0) {
        html += `<div class="empty-tip">目前没有得分达到 8 分的明显优势项。建议先集中提升 1-2 项较接近 8 分的能力，帮助孩子建立成就感。</div>`;
      } else {
        strengths.forEach(item => {
          const ab = abilities[item.index];
          html += buildResultCard(ab, item.score, "strength");
        });
      }

      html += "<h3>弱势能力分析（得分 ≤ 5 分）</h3>";
      if (weaknesses.length === 0) {
        html += `<div class="empty-tip">目前没有得分低于 5 分的明显弱势项。建议保持当前节奏，在 6-7 分的项目上继续精进。</div>`;
      } else {
        weaknesses.forEach(item => {
          const ab = abilities[item.index];
          html += buildResultCard(ab, item.score, "weakness");
        });
      }

      html += "<h3>近期发展目标</h3>";
      html += `<div class="ability-result">`;
      html += `<ul>`;
      if (weaknesses.length > 0) {
        html += `<li><strong>短期（1-3个月）：</strong>重点提升${weaknesses.map(x => abilities[x.index].key).join("、")}，目标每项提升 1-2 分。</li>`;
      } else {
        html += `<li><strong>短期（1-3个月）：</strong>巩固现有优势，在 6-7 分的中等能力中选择 1 项集中突破。</li>`;
      }
      html += `<li><strong>中期（3-6个月）：</strong>将薄弱项全部提升到 6 分以上，优势项保持 8 分以上。</li>`;
      html += `<li><strong>长期（6-12个月）：</strong>12 项能力均衡发展，平均分达到 7 分以上，形成孩子独特的核心竞争力。</li>`;
      html += `</ul></div>`;

      container.innerHTML = html;

      // 保存当前数据供重绘使用
      const canvas = document.getElementById("rainbowChart");
      canvas.dataset.name = name;
      canvas.dataset.scores = JSON.stringify(scores);
      canvas.dataset.avg = avg;
    }

    function buildResultCard(ab, score, type) {
      const info = type === "strength" ? ab.high : ab.low;
      const badgeClass = type === "strength" ? "strength" : "weakness";
      const label = type === "strength" ? "优势" : "待提升";
      return `
        <div class="ability-result ${type}">
          <h4>${ab.key}（${score} 分）<span class="badge ${badgeClass}">${label}</span></h4>
          <p>${info.msg}</p>
          <ul>
            ${info.tips.map(tip => `<li>${tip}</li>`).join("")}
          </ul>
        </div>
      `;
    }

    // ===== 历史记录查看 =====
    const historyOverlay = document.getElementById("historyOverlay");
    const historyList = document.getElementById("historyList");
    const historyPhone = document.getElementById("historyPhone");
    const historyClose = document.getElementById("historyClose");

    document.getElementById("historyBtn").addEventListener("click", () => {
      historyOverlay.classList.add("active");
      // 若输入区已填手机号，自动带入
      const curPhone = document.getElementById("parentPhone").value.trim();
      if (curPhone && historyPhone.value !== curPhone) historyPhone.value = curPhone;
      historyPhone.focus();
    });
    historyClose.addEventListener("click", () => historyOverlay.classList.remove("active"));
    historyOverlay.addEventListener("click", (e) => {
      if (e.target === historyOverlay) historyOverlay.classList.remove("active");
    });

    document.getElementById("historySearchBtn").addEventListener("click", doHistorySearch);
    historyPhone.addEventListener("keydown", (e) => {
      if (e.key === "Enter") doHistorySearch();
    });

    async function doHistorySearch() {
      const phone = historyPhone.value.trim();
      if (!/^1\d{10}$/.test(phone)) {
        historyList.innerHTML = `<div class="history-error">请输入正确的11位手机号。</div>`;
        return;
      }
      if (!supabaseClient) {
        historyList.innerHTML = `<div class="history-error">数据库未配置，无法查询历史记录。</div>`;
        return;
      }
      historyList.innerHTML = `<div class="history-loading">正在查询，请稍候...</div>`;
      try {
        const { data, error } = await supabaseClient
          .from('submissions')
          .select('id, child_name, phone, scores, avg_score, talent_type, created_at')
          .eq('phone', phone)
          .order('created_at', { ascending: false });
        if (error) {
          historyList.innerHTML = `<div class="history-error">查询失败：${error.message}</div>`;
          return;
        }
        if (!data || data.length === 0) {
          historyList.innerHTML = `<div class="history-empty">该手机号暂无历史记录。<br>请确认输入的手机号与填写时一致。</div>`;
          return;
        }
        let html = "";
        data.forEach((r) => {
          const time = r.created_at ? new Date(r.created_at).toLocaleString("zh-CN", { hour12: false }) : "";
          const scores = Array.isArray(r.scores) ? r.scores : [];
          const avg = r.avg_score != null ? Number(r.avg_score).toFixed(1) : (scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : "-");
          html += `
            <div class="history-item" data-id="${r.id}">
              <div class="hi-main">
                <div class="hi-name">${escapeHtml(r.child_name || "未命名")}</div>
                <div class="hi-time">${time || ""}</div>
              </div>
              <div class="hi-right">
                <div class="hi-avg">${avg} 分</div>
                <div class="hi-type">${escapeHtml(r.talent_type || "")}</div>
              </div>
            </div>`;
        });
        historyList.innerHTML = html;
        historyList.querySelectorAll(".history-item").forEach((item) => {
          item.addEventListener("click", () => {
            const id = item.dataset.id;
            const rec = data.find((x) => String(x.id) === String(id));
            if (rec) showHistoryRecord(rec);
          });
        });
      } catch (err) {
        historyList.innerHTML = `<div class="history-error">查询出错：${err.message}</div>`;
      }
    }

    function showHistoryRecord(rec) {
      const scores = Array.isArray(rec.scores) ? rec.scores : [];
      if (scores.length !== abilities.length) {
        historyList.innerHTML = `<div class="history-error">该记录数据不完整，无法展示报告。</div>`;
        return;
      }
      // 关闭弹窗
      historyOverlay.classList.remove("active");
      // 填充表单姓名与手机号
      document.getElementById("childName").value = rec.child_name || "";
      document.getElementById("parentPhone").value = rec.phone || "";
      // 回填各项评分到能力卡片
      scores.forEach((s, i) => {
        const numInput = document.getElementById(`num-${i}`);
        if (numInput) numInput.value = s;
        const btns = document.querySelectorAll(`#btns-${i} .score-btn`);
        btns.forEach((b) => b.classList.remove("selected"));
        btns.forEach((b) => { if (parseInt(b.dataset.score, 10) === s) b.classList.add("selected"); });
        const valEl = document.getElementById(`val-${i}`);
        if (valEl) { valEl.textContent = s; valEl.style.color = ""; }
      });
      // 计算平均分并渲染
      const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
      const avgFixed = avg.toFixed(1);
      renderTable(scores, avgFixed);
      renderAnalysis(rec.child_name || "", scores, avg);
      const resultSection = document.getElementById("resultSection");
      resultSection.classList.remove("hidden");
      setTimeout(() => {
        drawChart(document.getElementById("rainbowChart"), rec.child_name || "", scores, avg);
        resultSection.scrollIntoView({ behavior: "smooth" });
      }, 50);
    }

    function escapeHtml(str) {
      if (str == null) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // ===== 彩虹图点击放大 =====
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxClose = document.getElementById("lightboxClose");

    document.querySelector(".chart-wrap").addEventListener("click", () => {
      const chartCanvas = document.getElementById("rainbowChart");
      if (!chartCanvas) return;
      lightboxImg.src = chartCanvas.toDataURL("image/png");
      lightbox.classList.add("active");
    });

    function closeLightbox() {
      lightbox.classList.remove("active");
      lightboxImg.src = "";
    }
    lightboxClose.addEventListener("click", (e) => {
      e.stopPropagation();
      closeLightbox();
    });
    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    document.getElementById("saveBtn").addEventListener("click", () => {
      const result = document.getElementById("resultSection");
      if (typeof html2canvas === "undefined") {
        alert("图片保存库尚未加载，请检查网络后重试。");
        return;
      }
      html2canvas(result, { scale: 2, backgroundColor: "#ffffff" }).then(canvas => {
        const link = document.createElement("a");
        const name = document.getElementById("childName").value.trim() || "孩子";
        link.download = `${name}_生命彩虹图.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    });

    document.getElementById("savePdfBtn").addEventListener("click", () => {
      const result = document.getElementById("resultSection");
      if (typeof html2canvas === "undefined" || typeof jspdf === "undefined") {
        alert("PDF 保存库尚未加载，请检查网络后重试。");
        return;
      }
      const name = document.getElementById("childName").value.trim() || "孩子";
      html2canvas(result, { scale: 2, backgroundColor: "#ffffff", useCORS: true }).then(canvas => {
        const imgData = canvas.toDataURL("image/jpeg", 0.95);
        const pdf = new jspdf.jsPDF("p", "mm", "a4");
        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();
        const imgH = canvas.height * pageW / canvas.width;
        let heightLeft = imgH;
        let position = 0;
        pdf.addImage(imgData, "JPEG", 0, position, pageW, imgH);
        heightLeft -= pageH;
        while (heightLeft > 0) {
          position -= pageH;
          pdf.addPage();
          pdf.addImage(imgData, "JPEG", 0, position, pageW, imgH);
          heightLeft -= pageH;
        }
        pdf.save(`${name}_生命彩虹图报告.pdf`);
      });
    });
  </script>
</body>
</html>
